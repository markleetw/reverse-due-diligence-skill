<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{公司名}} 反向盡職調查</title>
<!--
  報告樣板 — reverse-due-diligence skill
  1) 把 {{...}} 佔位符換掉
  2) 依 references/report-template.md 的骨架填章節
  3) 在 drawAll() 裡呼叫需要的繪圖函式（畫圖前先讀 dataviz skill）
  4) 用 Playwright 截圖檢查排版與 console 錯誤後再交付
-->
<style>
:root{
  color-scheme: light;
  --surface-0:#f6f5f2; --surface-1:#fcfcfb; --surface-2:#f0efec;
  --border:#e2e0da; --border-strong:#c9c6bd;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7c7a74;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --good:#008300; --warn:#eda100; --serious:#eb6834; --critical:#e34948;
  --grid:#e6e4de;
}
:root[data-theme="dark"], :root:where(:not([data-theme="light"])){}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242422;
    --border:#33332f; --border-strong:#4a4a45;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#96958c;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --good:#4caf50; --warn:#c98500; --serious:#d95926; --critical:#e66767;
    --grid:#2e2e2b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242422;
  --border:#33332f; --border-strong:#4a4a45;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#96958c;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --good:#4caf50; --warn:#c98500; --serious:#d95926; --critical:#e66767;
  --grid:#2e2e2b;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--surface-0); color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.75; font-size:15.5px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:0 22px 100px}
header.hero{padding:56px 0 30px;border-bottom:1px solid var(--border)}
.kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
h1{font-size:clamp(28px,4.6vw,42px);line-height:1.2;margin:14px 0 10px;letter-spacing:-.02em}
.sub{color:var(--text-secondary);font-size:16px;max-width:64ch;margin:0}
.meta{margin-top:20px;font-size:13px;color:var(--text-muted)}
h2{font-size:23px;margin:56px 0 6px;letter-spacing:-.01em;scroll-margin-top:20px}
h2 .num{color:var(--text-muted);font-variant-numeric:tabular-nums;font-weight:500;margin-right:10px}
h3{font-size:17px;margin:30px 0 8px}
p{margin:12px 0}
a{color:var(--series-1)}
small{color:var(--text-muted)}
.lead{color:var(--text-secondary)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin:22px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin:26px 0}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:15px 16px}
.tile .lab{font-size:11.5px;color:var(--text-muted);letter-spacing:.03em;font-weight:600}
.tile .val{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:5px;line-height:1.15}
.tile .note{font-size:12px;color:var(--text-secondary);margin-top:3px}
.up{color:var(--good)} .down{color:var(--critical)}
table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
thead th{font-size:12px;color:var(--text-muted);letter-spacing:.04em;border-bottom:1px solid var(--border-strong);font-weight:650}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-size:12px;color:var(--text-muted);border:0;text-align:left}
.fig{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:20px 20px 14px;margin:26px 0}
.fig .ftitle{font-size:15px;font-weight:650;margin-bottom:2px}
.fig .fsub{font-size:12.5px;color:var(--text-secondary);margin-bottom:14px}
.fig figcaption{font-size:12px;color:var(--text-muted);margin-top:10px;border-top:1px solid var(--border);padding-top:9px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:2px 0 12px;font-size:12.5px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
svg{display:block;width:100%;height:auto;overflow:visible}
.grid-line{stroke:var(--grid);stroke-width:1}
.axis-t{fill:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums}
.lab-t{fill:var(--text-primary);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.lab-s{fill:var(--text-secondary);font-size:10.5px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:680px){.two{grid-template-columns:1fr}}
