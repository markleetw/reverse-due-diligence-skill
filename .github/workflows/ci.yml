name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run repository checks
        run: python scripts/check_repo.py
      - name: Build the exact release-format ZIP
        run: python scripts/package.py --output dist/reverse-due-diligence.zip
      - name: Verify ZIP bytes, manifest, and VERSION
        run: |
          python scripts/package.py --verify dist/reverse-due-diligence.zip --expected-version "$(tr -d '[:space:]' < VERSION)"
      # CI verifies the distributable but intentionally does not publish a ZIP
      # artifact carrying the same VERSION as an already published Release.
