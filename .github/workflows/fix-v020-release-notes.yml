name: Fix v0.2.0 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-v020-release-notes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild v0.2.0 notes from current README release block
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          awk '
            /<!-- release-notes:start -->/ { keep=1; next }
            /<!-- release-notes:end -->/   { keep=0 }
            keep
          ' README.md > /tmp/release-notes.md

          gh release edit v0.2.0 --notes-file /tmp/release-notes.md
