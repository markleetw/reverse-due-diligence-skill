name: Release

# Publishing requires an explicit maintainer workflow dispatch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New approved version tag, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rdd-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the explicitly dispatched source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version, source and immutable release policy
        id: validate
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only vMAJOR.MINOR.PATCH is accepted" >&2
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "VERSION does not match requested Tag: $VERSION / $TAG" >&2
            exit 1
          fi
          git fetch --tags
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TARGET="$(git rev-list -n 1 "refs/tags/$TAG")"
            if [[ "$TARGET" != "$GITHUB_SHA" ]]; then
              echo "Existing Tag points at a different source; refusing overwrite" >&2
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release already exists; published assets are immutable" >&2
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run repository and package tests
        run: python scripts/check_repo.py

      - name: Install Chromium test dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run renderer and XSS browser regression
        run: python scripts/browser_test.py

      - name: Build and verify release ZIP
        run: |
          mkdir -p dist
          python scripts/package.py --output dist/reverse-due-diligence.zip
          python scripts/package.py --verify dist/reverse-due-diligence.zip --expected-version "$(tr -d '[:space:]' < VERSION)"

      - name: Generate bilingual release notes and checksum
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_notes.py --version "${TAG#v}" --output dist/release-notes.md
          (cd dist && sha256sum reverse-due-diligence.zip > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Upload reviewed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdd-release-artifacts
          path: |
            dist/reverse-due-diligence.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error

      - name: Create new immutable Tag if necessary
        env:
          TAG: ${{ inputs.tag }}
          TAG_EXISTS: ${{ steps.validate.outputs.tag_exists }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TAG_EXISTS" == "true" ]]; then
            echo "Resuming same-source, unpublished Tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create new GitHub Release (no overwrite)
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/reverse-due-diligence.zip \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Reverse Due Diligence Skill $TAG" \
            --notes-file dist/release-notes.md
