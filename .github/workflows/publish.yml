# Historical filename retained; this workflow no longer publishes a Release.
name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run repository checks
        run: python scripts/check_repo.py
      - name: Build release-format ZIP
        run: python scripts/package.py --output dist/reverse-due-diligence.zip
      - name: Verify the actual ZIP
        run: |
          python scripts/package.py --verify dist/reverse-due-diligence.zip --expected-version "$(tr -d '[:space:]' < VERSION)"
      - name: Record checksum
        run: |
          (cd dist && sha256sum reverse-due-diligence.zip > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rdd-release-candidate
          path: |
            dist/reverse-due-diligence.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
