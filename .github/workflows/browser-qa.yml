name: Browser QA

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - "templates/**"
      - "scripts/browser_test.py"
      - ".github/workflows/browser-qa.yml"
  pull_request:
    paths:
      - "demo/**"
      - "templates/**"
      - "scripts/browser_test.py"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run browser QA
        run: python scripts/browser_test.py
