name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新建置／發布的既有 tag，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 格式不合法：$TAG" >&2
            exit 1
          fi

          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify VERSION matches tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "VERSION ($VERSION) 與 release tag ($TAG) 不一致。" >&2
            exit 1
          fi

      - name: Run repository checks
        run: python scripts/check_repo.py

      - name: Build ZIP
        run: |
          mkdir -p dist
          python scripts/package.py --output dist/reverse-due-diligence.zip

      - name: Inspect package
        run: |
          python - <<'PY'
          import zipfile
          p = "dist/reverse-due-diligence.zip"
          expected = {
              "rdd/SKILL.md",
              "rdd/references/analysis-playbook.md",
              "rdd/references/global-sources.md",
              "rdd/references/report-template.md",
              "rdd/references/taiwan-sources.md",
              "rdd/templates/report-shell.html",
              "rdd/scripts/audit.py",
          }
          with zipfile.ZipFile(p) as z:
              actual = set(z.namelist())
          if actual != expected:
              raise SystemExit(
                  f"package contents mismatch\nexpected={sorted(expected)}\nactual={sorted(actual)}"
              )
          print("Package contents verified.")
          PY

      - name: Build release notes from tagged source
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          awk '
            /<!-- release-notes:start -->/ { keep=1; next }
            /<!-- release-notes:end -->/   { keep=0 }
            keep
          ' README.md > dist/release-content.md

          cp dist/release-content.md dist/release-notes.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reverse-due-diligence-skill
          path: dist/reverse-due-diligence.zip
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" reverse-due-diligence.skill -y >/dev/null 2>&1 || true
            gh release delete-asset "$TAG" SHA256SUMS.txt -y >/dev/null 2>&1 || true
            gh release upload "$TAG" dist/reverse-due-diligence.zip --clobber
            gh release edit "$TAG" \
              --title "Reverse Due Diligence Skill $TAG" \
              --notes-file dist/release-notes.md
          else
            gh release create "$TAG" \
              dist/reverse-due-diligence.zip \
              --verify-tag \
              --title "Reverse Due Diligence Skill $TAG" \
              --notes-file dist/release-notes.md
          fi
